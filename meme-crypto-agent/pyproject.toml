[project]
name = "meme-crypto-agent"
version = "0.1.0"
description = "Agent Stack starter: meme coin & crypto research with live DEX data and a red-flag scorer."
requires-python = ">=3.11,<3.15"
dependencies = [
    "agentstack-sdk==0.7.1",
    "beeai-framework[duckduckgo,a2a]==0.1.78",
    "mcp>=1.26,<2",          # agentstack-sdk 0.7.1 breaks on mcp 2.x
    "fastapi>=0.131,<0.140", # newer FastAPI rejects a kwarg the SDK passes through
    "httpx>=0.27",
    "uvicorn>=0.37.0,<0.38.0",
    "anthropic>=1.1",
]

[project.scripts]
server = "meme_crypto_agent.agent:serve"
research = "meme_crypto_agent.run_local:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
